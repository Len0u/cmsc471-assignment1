<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1: Interactive Visualization with D3.js</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container"> <!-- Centers content and sets max width -->
        <h1>Assignment 1: Interactive Visualization with D3.js</h1>
        <p id="value"></p>
        <div id="slider"></div> 

        <div id="controls">
            Y: <select id="yVariable" class="variable"></select>
            Filter Data: <select id="filter" class="filter"></select>
            <button id="backToRegions" class="btn" style="display:none">&larr; Back to regions</button>
        </div>

        <div id="tooltip" style="display:none"></div> 

        <div id="vis"></div> <!--  Will hold our visualization (SVG) -->
    </div>
    
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-simple-slider"></script>
    <script src="js/script.js"></script>
    
</body>
</html>
